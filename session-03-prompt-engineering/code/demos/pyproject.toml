[tool.poetry]
name = "prompt-engineering-demos"
version = "0.1.0"
description = "Offline demos for prompt engineering and structured outputs: prompt anatomy, context budget, alignment, JSON and function-calling, guardrails, validation, A/B."
authors = ["GuildTrek"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
