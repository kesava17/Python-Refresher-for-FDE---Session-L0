[tool.poetry]
name = "prompt-layer"
version = "0.1.0"
description = "The prompt and output layer for the Sunrise Support Deflection Assistant: a validated Answer, two ways, with context engineering and guardrails."
authors = ["GuildTrek"]
packages = [
    { include = "model_layer", from = "src" },
    { include = "prompt_layer", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
