[tool.poetry]
name = "telemetry-insight"
version = "0.7.0"
description = "IoT telemetry insight. Secure: object-level authorization, mass-assignment protection, sensitive-field masking, security logging, secret scan, hardened container."
authors = ["GuildTrek <hello@guildtrek.com>"]
packages = [{ include = "telemetry_insight", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "^1.0"
fastapi = "^0.141.1"
httpx = "^0.28.1"
uvicorn = "^0.52.3"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
mypy = ">=1.11"
pytest = ">=8.0"
pre-commit = ">=3.7"

[tool.poetry.scripts]
telemetry = "telemetry_insight.cli:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
