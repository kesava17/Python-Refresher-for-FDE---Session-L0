[tool.poetry]
name = "secure-demos"
version = "0.1.0"
description = "Runnable one-idea demos for the Secure topic (application security), to be run through Poetry."
authors = ["GuildTrek <hello@guildtrek.com>"]
# These are standalone scripts, not an installable package, so there is nothing to build.
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.141.1"
httpx = "^0.28.1"
cryptography = "^43.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
mypy = ">=1.11"
pytest = ">=8.0"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
