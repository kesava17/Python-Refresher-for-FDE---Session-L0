[tool.poetry]
name = "model-layer"
version = "0.1.0"
description = "The pluggable model layer for the Sunrise Support Deflection Assistant."
authors = ["GuildTrek"]
packages = [{ include = "model_layer", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
