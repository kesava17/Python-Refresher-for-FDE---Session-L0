<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="tb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4F46E5"/></marker>
  </defs>

  <!-- left: the flow up the stack -->
  <rect x="40" y="300" width="240" height="40" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="160" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Input tokens</text>
  <line x1="160" y1="300" x2="160" y2="276" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#tb)"/>

  <rect x="40" y="234" width="240" height="40" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="160" y="259" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Embeddings + position</text>
  <line x1="160" y1="234" x2="160" y2="210" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#tb)"/>

  <rect x="40" y="168" width="240" height="40" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="160" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">Self-attention</text>
  <line x1="160" y1="168" x2="160" y2="144" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#tb)"/>

  <rect x="40" y="102" width="240" height="40" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="160" y="127" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Feed-forward network</text>
  <line x1="160" y1="102" x2="160" y2="78" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#tb)"/>

  <rect x="40" y="34" width="240" height="42" rx="9" fill="#4F46E5"/>
  <text x="160" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Next-token probabilities</text>

  <!-- xN bracket -->
  <path d="M300,102 L316,102 L316,274 L300,274" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
  <text x="326" y="193" font-size="13" font-weight="600" fill="#64748B">x N layers</text>

  <!-- right: the self-attention idea -->
  <rect x="430" y="120" width="360" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="450" y="148" font-size="14" font-weight="700" fill="#059669">Self-attention, in one idea</text>
  <text x="450" y="176" font-size="13" fill="#334155">Every token looks at every other token</text>
  <text x="450" y="196" font-size="13" fill="#334155">and weighs how much each one matters.</text>
  <text x="450" y="224" font-size="13" fill="#334155">In "is it under warranty", the model links</text>
  <text x="450" y="244" font-size="13" fill="#334155">"it" to the product, all at once, not word</text>
  <text x="450" y="264" font-size="13" fill="#334155">by word. That is the 2017 breakthrough.</text>

  <text x="610" y="300" text-anchor="middle" font-size="12.5" fill="#64748B" font-style="italic">"Attention Is All You Need", Vaswani et al., 2017</text>
</svg>
