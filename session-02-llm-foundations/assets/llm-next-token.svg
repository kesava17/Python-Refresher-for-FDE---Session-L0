<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4F46E5"/></marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#10B981"/></marker>
  </defs>

  <!-- input text -->
  <rect x="16" y="70" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="91" y="94" text-anchor="middle" font-size="12" fill="#64748B">input text</text>
  <text x="91" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">"where is my order"</text>
  <line x1="170" y1="98" x2="196" y2="98" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#ah)"/>

  <!-- tokens -->
  <rect x="200" y="70" width="180" height="56" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="290" y="90" text-anchor="middle" font-size="12" fill="#64748B">tokens</text>
  <text x="290" y="110" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0F172A">[where][is][my][order]</text>
  <line x1="384" y1="98" x2="410" y2="98" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#ah)"/>

  <!-- the model -->
  <rect x="414" y="52" width="176" height="92" rx="12" fill="#4F46E5"/>
  <text x="502" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Transformer</text>
  <text x="502" y="114" text-anchor="middle" font-size="12.5" fill="#C7D2FE">the language model</text>
  <line x1="594" y1="98" x2="620" y2="98" stroke="#4F46E5" stroke-width="2.2" marker-end="url(#ah)"/>

  <!-- output: next-token probabilities -->
  <rect x="624" y="40" width="300" height="116" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
  <text x="640" y="62" font-size="12.5" fill="#059669" font-weight="600">next-token probabilities</text>
  <text x="640" y="86"  font-size="13" fill="#0F172A">?</text>
  <rect x="716" y="76" width="150" height="12" rx="3" fill="#10B981"/><text x="872" y="86" font-size="12" fill="#334155">0.68</text>
  <text x="640" y="108" font-size="13" fill="#0F172A">please</text>
  <rect x="716" y="98" width="30" height="12" rx="3" fill="#A7F3D0"/><text x="752" y="108" font-size="12" fill="#334155">0.12</text>
  <text x="640" y="130" font-size="13" fill="#0F172A">number</text>
  <rect x="716" y="120" width="18" height="12" rx="3" fill="#A7F3D0"/><text x="740" y="130" font-size="12" fill="#334155">0.08</text>

  <!-- the loop -->
  <path d="M774,156 C774,214 774,232 470,232 C150,232 91,214 91,128" fill="none" stroke="#10B981" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
  <text x="470" y="256" text-anchor="middle" font-size="13" fill="#059669" font-style="italic">pick the most likely token, add it to the text, and predict the next one</text>
</svg>
