[tool.poetry]
name = "stock-analytics"
version = "0.1.0"
description = "Data Analytics with Python: an end-to-end stock-analytics notebook. Descriptive analytics and presentation, not investment advice."
authors = ["GuildTrek <hello@guildtrek.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
jupyterlab = ">=4.0"
pandas = ">=2.1"
numpy = ">=1.26"
matplotlib = ">=3.8"
seaborn = ">=0.13"
pyarrow = ">=15.0"
duckdb = ">=1.0"
polars = ">=1.0"
dask = { extras = ["dataframe"], version = ">=2024.1.0" }
# pyspark is optional (needs a Java runtime): `poetry add pyspark` to run pyspark_explore.ipynb

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"

[tool.ruff]
line-length = 88
target-version = "py311"
