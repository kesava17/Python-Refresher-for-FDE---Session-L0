# The whole system on a laptop: three services from one image, each on its own port, each
# with its own database volume, sharing the event broker. `docker compose up` and watch them
# talk. This is the local parity the lab is built to give you.
services:
  gateway:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      INGEST_URL: http://telemetry-ingest:8001
      ROLLUP_URL: http://telemetry-rollup:8002
    depends_on:
      - telemetry-ingest
      - telemetry-rollup

  telemetry-ingest:
    build: .
    command: uvicorn telemetry_ingest.main:app --host 0.0.0.0 --port 8001
    environment:
      INGEST_DB: /data/ingest.db
      BROKER_PATH: /broker/broker.jsonl
    volumes:
      - ingest-data:/data
      - broker:/broker

  telemetry-rollup:
    build: .
    command: uvicorn telemetry_rollup.main:app --host 0.0.0.0 --port 8002
    environment:
      ROLLUP_DB: /data/rollup.db
      BROKER_PATH: /broker/broker.jsonl
    volumes:
      - rollup-data:/data
      - broker:/broker

volumes:
  ingest-data:
  rollup-data:
  broker:
