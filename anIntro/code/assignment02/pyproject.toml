[tool.poetry]
name = "ann-intro-assignment02"
version = "1.0.0"
description = "ANN introduction assignment02: experiments on the tinynn network built in the live lab."
authors = ["GuildTrek <hello@guildtrek.com>"]
packages = [{ include = "tinynn", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
mypy = ">=1.11"
pytest = ">=8.0"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
