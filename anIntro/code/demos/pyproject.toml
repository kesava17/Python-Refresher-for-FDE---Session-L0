[tool.poetry]
name = "ann-intro-demos"
version = "1.0.0"
description = "Standard-library demos for the ANN introduction: a neuron, a perceptron learning OR, the XOR wall, a two-layer network crossing it, gradient descent, and embeddings."
authors = ["GuildTrek <hello@guildtrek.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
mypy = ">=1.11"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
